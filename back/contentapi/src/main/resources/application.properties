spring.application.name=contentapi

# ?????? ?? ??
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/seoulmate
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ?? (??)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# ?????? ?? ?? ?? ??
logging.level.org.springframework.jdbc.datasource=DEBUG
logging.level.org.hibernate.engine.jdbc.connections=DEBUG
logging.level.org.hibernate.engine.transaction=DEBUG
logging.level.com.mysql.cj.jdbc.Connection=DEBUG


jwt.public-key-path=${PUBLIC_KEY_PATH}