name: Deploy to EC2  # GitHub Actions의 워크플로 이름

on:
  push:
    branches:
      - main  # main 브랜치에 push될 때 실행

jobs:
  build:
    runs-on: ubuntu-latest  # GitHub Actions에서 사용할 가상 환경 (Ubuntu 최신 버전)

    steps:
      - name: Checkout repository  # GitHub 리포지토리 코드 가져오기
        uses: actions/checkout@v3

      - name: Set up JDK 17  # Java 17 환경 설정
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build oauthlogin with Gradle  # oauthlogin 프로젝트 빌드 (테스트 제외)
        run: |
          cd back/oauthlogin
          ./gradlew clean build -x test

      - name: Login to Docker Hub  # Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push oauthlogin Docker image  # Docker 이미지 빌드 및 Docker Hub로 푸시
        run: |
          cd back/oauthlogin
          docker build -t rio8972/oauthlogin .
          docker push rio8972/oauthlogin

  deploy:
    needs: build  # build 작업이 완료된 후 실행
    runs-on: ubuntu-latest  # GitHub Actions의 가상 환경에서 실행

    steps:
      - name: SSH into EC2 and deploy  # EC2 서버에 SSH로 접속 후 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}  # EC2 인스턴스의 퍼블릭 IP 또는 도메인
          username: ubuntu  # EC2 기본 사용자명
          key: ${{ secrets.EC2_SSH_KEY }}  # SSH 개인 키 ->(GitHub Secrets에 저장)
          script: |
            cd docker-compose  # docker-compose.yml이 있는 디렉터리로 이동

            # 최신 Docker 이미지 Pull
            docker-compose pull

            # 기존 컨테이너 중지 및 삭제
            docker-compose down

            # 새로운 컨테이너 실행
            docker-compose up -d
