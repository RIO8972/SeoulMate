name: Deploy to EC2  # GitHub Actions의 워크플로 이름

on:
  push:
    branches:
      - main  # main 브랜치에 push될 때 실행

jobs:
  build:
    runs-on: ubuntu-latest  # GitHub Actions에서 사용할 가상 환경 (Ubuntu 최신 버전)

    steps:
      - name: Checkout repository  # GitHub 리포지토리 코드 가져오기
        uses: actions/checkout@v3

      - name: Set up JDK 17  # Java 17 환경 설정
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build oauthlogin with Gradle  # oauthlogin 프로젝트 빌드 (테스트 제외)
        run: |
          cd back/oauthlogin
          ./gradlew clean build -x test

      - name: Login to Docker Hub  # Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push oauthlogin Docker image  # Docker 이미지 빌드 및 Docker Hub로 푸시
        run: |
          cd back/oauthlogin
          docker build -t rio8972/oauthlogin .
          docker push rio8972/oauthlogin

  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Base64로 인코딩된 SSH 키 복호화
      - name: Set up SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa  # 권한 설정
        shell: bash

      # Step 2: SSH로 EC2에 접속하여 배포 작업 수행
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}  # EC2 인스턴스의 퍼블릭 IP
          username: ubuntu  # EC2 기본 사용자명
          key: ${{ secrets.EC2_SSH_KEY }}  # GitHub Secrets에서 SSH 키 가져오기
          port: 22  # SSH 포트
          script: |
            # EC2에서 실행할 명령어
            cd docker-compose
            docker-compose pull
            docker-compose down
            docker-compose up -d
